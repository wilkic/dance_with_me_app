<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Dance With Me</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Live camera feed (hidden; used as the pose-detection source) -->
    <video id="video" playsinline muted autoplay></video>

    <!-- Main output: room background + avatar composited here -->
    <canvas id="stage"></canvas>

    <!-- ===== Screen: start ===== -->
    <section id="screen-start" class="screen">
      <h1>Dance&nbsp;With&nbsp;Me</h1>
      <p class="tagline">Scan your room. Step in. Dance as a stick figure.</p>
      <button id="btn-start" class="primary">Start Camera</button>
      <p class="hint">Works best on a phone. Allow camera access when prompted.</p>
    </section>

    <!-- ===== Screen: room capture ===== -->
    <section id="screen-capture" class="screen hidden">
      <div class="top-banner">
        <p id="capture-instructions">
          Prop your phone up so it can see your dance space,
          then step <b>out of frame</b> and tap Capture Room.
        </p>
      </div>
      <div class="bottom-bar">
        <button id="btn-flip" title="Flip camera">&#8635; Flip</button>
        <button id="btn-capture" class="primary">Capture Room</button>
      </div>
      <div id="countdown" class="hidden"></div>
    </section>

    <!-- ===== Screen: dance ===== -->
    <section id="screen-dance" class="screen hidden">
      <div class="hud">
        <span id="hud-fps">-- fps</span>
        <span id="hud-bpm">-- bpm</span>
        <span id="hud-status"></span>
      </div>
      <div class="bottom-bar">
        <button id="btn-rescan">&#8617; Rescan</button>
        <button id="btn-ghost" title="Toggle between clean room and live feed">Ghost: ON</button>
      </div>
    </section>

    <div id="loading" class="hidden"><div class="spinner"></div><p id="loading-msg">Loading…</p></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
