name: Deploy to GitHub Pages

# The public site follows the `release` branch; publish with
#   git push origin main:release
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public dance server (rooms + BPM). Set the DANCE_SERVER_URL
          # repository variable to e.g. wss://dance-server.example.com/ws;
          # unset = the deployed app is solo-only.
          VITE_SERVER_URL: ${{ vars.DANCE_SERVER_URL }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
